<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama</title>
    <style>
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }
        .card {
            width: 238px;
            height: 357px;
            perspective: 1000px;
            cursor: pointer;
            border-radius: 35px;
            overflow: hidden;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
        }
        .card-front {
            background-color: #a1ce00;
            background-image: url(Reverso.png);
            background-size: 238px 357px;
            display:flex
        }
        .card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <center>
    <img src="Granjarama.png" width="800">
    </center>
    <div class="game-board"></div>

    <script>
        const images = [
            "POLLO.png", "VACA.png", "PATO.png", "OVEJA.png",
            "GALLINA.png", "CONEJO.png", "CERDO.png", "CABALLO.png",
            "POLLO.png", "VACA.png", "PATO.png", "OVEJA.png",
            "GALLINA.png", "CONEJO.png", "CERDO.png", "CABALLO.png"
        ].sort(() => Math.random() - 0.5);

        const board = document.querySelector('.game-board');
        let selectedCards = [];
        let matchedPairs = 0;

        images.forEach(image => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back">
                        <img src="${image}" width="238" height="357">
                    </div>
                </div>
            `;

            card.addEventListener('click', () => {
                if (selectedCards.length < 2 && !card.classList.contains('flipped')) {
                    card.classList.add('flipped');
                    selectedCards.push(card);
                    
                    if (selectedCards.length === 2) {
                        setTimeout(() => {
                            const [first, second] = selectedCards;
                            if (first.innerHTML !== second.innerHTML) {
                                first.classList.remove('flipped');
                                second.classList.remove('flipped');
                            } else {
                                matchedPairs++;
                                if (matchedPairs === 8) alert('¡Ganaste!');
                            }
                            selectedCards = [];
                        }, 1000);
                    }
                }
            });

            board.appendChild(card);
        });
    </script>
</body>
</html>
